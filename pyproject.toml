[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "chemrag"
version = "0.1.0"
description = "Chemistry-domain RAG system with scientific PDF parsing, chemical structure recognition, and multi-agent retrieval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ChemRAG Team" }]
keywords = ["chemistry", "rag", "llm", "scientific", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Redis / Cache / Queue
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.4.0",

    # AI / LLM
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",

    # Embeddings & Retrieval
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",

    # Reranking
    "cohere>=5.5.0",

    # PDF & Document parsing
    "pymupdf>=1.24.0",
    "Pillow>=10.3.0",
    "requests>=2.31.0",

    # Chemistry
    "rdkit>=2024.3.1",
    "pubchempy>=1.0.4",

    # Storage
    "boto3>=1.34.0",        # S3-compatible

    # Observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.20.0",
    "structlog>=24.2.0",

    # Evaluation
    "ragas>=0.1.10",

    # Utilities
    "tenacity>=8.3.0",
    "anyio>=4.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-docker>=2.0.0",
    "httpx>=0.27.0",       # for TestClient
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "C4", "ISC", "ICN"]
ignore = ["ANN101", "ANN102", "S101"]  # allow assert in tests
src = ["backend"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 80
